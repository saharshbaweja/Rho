      <circle cx="94" cy="306" r="23" fill="#E5F1FD"/>
      <path d="M81 309h26a9 9 0 0 0-2-17 12 12 0 0 0-23 4 7 7 0 0 0-1 13Zm8 7-3 6m12-6-3 6" stroke="#4188B8" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="138" y="267" width="682" height="85" rx="18" fill="#EFF6FF" stroke="#D3E5F8"/>
      <text x="160" y="299" font-size="20" font-weight="700" fill="#3274A4">01  DETECT THE CHANGE</text>
      <text x="160" y="330" font-size="26" font-weight="700" fill="#163E5A">Arrival forecast deteriorates</text>
    </g>
    <g>
      <circle cx="94" cy="409" r="23" fill="#EAE8FF"/>
      <path d="M83 406h22M83 413h22m-15-14v21m8-21v21" stroke="#7772B5" stroke-width="2.5" stroke-linecap="round"/>
