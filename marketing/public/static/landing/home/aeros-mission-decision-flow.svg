    <circle cx="94" cy="818" r="23" fill="#E0ECF5"/>
    <circle cx="94" cy="811" r="6" stroke="#406D8B" stroke-width="2.5"/><path d="M83 829v-3a11 11 0 0 1 22 0v3" stroke="#406D8B" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="138" y="781" width="682" height="91" rx="20" fill="#173C56"/>
