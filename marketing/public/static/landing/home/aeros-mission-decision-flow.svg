<svg xmlns="http://www.w3.org/2000/svg" width="880" height="960" viewBox="0 0 880 960" fill="none">
  <title>Aeros: from weather change to dispatcher review</title>
  <desc>An illustrative mission connects weather, NOTAMs, aircraft and crew context to operational impact, alternative options and a human review.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="0" x2="800" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4FAFF"/></linearGradient>
    <linearGradient id="brand" x1="56" y1="40" x2="140" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#174C73"/><stop offset="1" stop-color="#0C2439"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D5377" flood-opacity=".08"/></filter>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
