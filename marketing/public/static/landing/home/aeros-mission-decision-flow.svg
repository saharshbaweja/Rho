<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720"><rect width="1040" height="720" rx="28" fill="#e9f7ff"/><rect x="30" y="30" width="980" height="660" rx="22" fill="#fff" stroke="#dce5ed"/><g font-family="Arial,sans-serif" fill="#111827"><text x="66" y="82" font-size="24" font-weight="700">aeros / mission orchestration</text><text x="66" y="118" font-size="16" fill="#667085">From natural language to results</text><path d="M65 147H975" stroke="#e2e8f0"/><rect x="62" y="176" width="916" height="74" rx="14" fill="#e9f7ff"/><circle cx="94" cy="213" r="12" fill="#1c91ff"/><text x="124" y="205" font-size="15" fill="#667085">01 / DESCRIBE</text><text x="124" y="230" font-size="20" font-weight="600">Define the objective, assets, and time window</text><rect x="62" y="268" width="916" height="74" rx="14" fill="#e9f7ff"/><circle cx="94" cy="305" r="12" fill="#1c91ff"/><text x="124" y="297" font-size="15" fill="#667085">02 / PLAN</text><text x="124" y="322" font-size="20" font-weight="600">Check readiness and assign connected fleets</text><rect x="62" y="360" width="916" height="74" rx="14" fill="#e9f7ff"/><circle cx="94" cy="397" r="12" fill="#1c91ff"/><text x="124" y="389" font-size="15" fill="#667085">03 / APPROVE</text><text x="124" y="414" font-size="20" font-weight="600">Operator reviews constraints and dispatch</text><rect x="62" y="452" width="916" height="74" rx="14" fill="#e9f7ff"/><circle cx="94" cy="489" r="12" fill="#1c91ff"/><text x="124" y="481" font-size="15" fill="#667085">04 / COORDINATE</text><text x="124" y="506" font-size="20" font-weight="600">Monitor execution and resolve exceptions</text><rect x="62" y="544" width="916" height="74" rx="14" fill="#e9f7ff"/><circle cx="94" cy="581" r="12" fill="#1c91ff"/><text x="124" y="573" font-size="15" fill="#667085">05 / REPORT</text><text x="124" y="598" font-size="20" font-weight="600">Return coverage and findings to your workflow</text><text x="66" y="660" font-size="13" fill="#667085">ILLUSTRATIVE PRODUCT WORKFLOW · SIMULATED DATA</text></g></svg>