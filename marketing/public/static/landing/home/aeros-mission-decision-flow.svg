    <text x="58" y="228" font-size="35" font-weight="700" fill="#102E43">AR245</text>
    <text x="226" y="227" font-size="29" fill="#31566E">KJFK</text>
    <path d="M320 217h70m-11-8 11 8-11 8" stroke="#7B9CB0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="412" y="227" font-size="29" fill="#31566E">EGLL</text>
    <rect x="630" y="194" width="190" height="44" rx="22" fill="#FFF0D7"/>
    <circle cx="653" cy="216" r="5" fill="#C98724"/>
