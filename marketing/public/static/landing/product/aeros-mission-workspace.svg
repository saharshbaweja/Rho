<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600"><title>Aeros illustrative mission workspace</title><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#245575" flood-opacity=".08"/></filter></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1040" height="600" rx="16" fill="#fafafa" stroke="#ececea"/><rect x="207" y="8" width="825" height="584" rx="12" fill="white" stroke="#ececea"/><text x="24" y="38" fill="#242424" font-size="20" font-weight="600">Aeros</text><rect x="116" y="20" width="66" height="24" rx="12" fill="#f0f0ef" stroke="#f0f0ef"/><text x="126" y="36" fill="#777772" font-size="10" font-weight="500">Workspace</text><rect x="16" y="62" width="176" height="32" rx="10" fill="white" stroke="#ececea"/><text x="30" y="83" fill="#999994" font-size="12" font-weight="400">Search missions</text><rect x="12" y="106" width="184" height="34" rx="8" fill="#e9f7ff" stroke="#e9f7ff"/><circle cx="28" cy="123" r="3" fill="#1c91ff"/><text x="43" y="129" fill="#1c91ff" font-size="12" font-weight="400">Mission overview</text><circle cx="28" cy="161" r="3" fill="#b4b4af"/><text x="43" y="167" fill="#242424" font-size="12" font-weight="400">Operational alerts</text><circle cx="28" cy="199" r="3" fill="#b4b4af"/><text x="43" y="205" fill="#242424" font-size="12" font-weight="400">Recovery planning</text><text x="23" y="259" fill="#777772" font-size="9" font-weight="600">WATCHLIST</text><text x="25" y="291" fill="#242424" font-size="12" font-weight="600">AR245</text><text x="25" y="309" fill="#777772" font-size="11" font-weight="400">JFK → LHR</text><circle cx="173" cy="287" r="3" fill="#e6a238"/><text x="25" y="346" fill="#242424" font-size="12" font-weight="600">AR318</text><text x="25" y="364" fill="#777772" font-size="11" font-weight="400">CDG → DXB</text><text x="25" y="401" fill="#242424" font-size="12" font-weight="600">AR612</text><text x="25" y="419" fill="#777772" font-size="11" font-weight="400">DOH → SIN</text><path d="M20 534h166" stroke="#ececea"/><text x="24" y="558" fill="#242424" font-size="12" font-weight="400">Dispatch workspace</text><text x="24" y="577" fill="#777772" font-size="10" font-weight="400">Illustrative product view</text><text x="232" y="37" fill="#242424" font-size="14" font-weight="600">Mission overview</text><text x="807" y="36" fill="#777772" font-size="10" font-weight="400">Illustrative mission workspace</text><path d="M208 54h824" stroke="#ececea"/><text x="238" y="95" fill="#242424" font-size="25" font-weight="500">Every mission. In context.</text><text x="238" y="120" fill="#777772" font-size="12" font-weight="400">Weather, aircraft, crew, and next steps in one shared view.</text><rect x="840" y="83" width="160" height="24" rx="12" fill="#fff6e5" stroke="#fff6e5"/><text x="850" y="99" fill="#9b6a1f" font-size="10" font-weight="500">3 missions need review</text><rect x="236" y="148" width="760" height="60" rx="10" fill="#fafafa" stroke="#ececea"/><text x="252" y="172" fill="#242424" font-size="16" font-weight="600">AR245</text><text x="252" y="192" fill="#777772" font-size="11" font-weight="400">JFK → LHR  ·  B787-9</text><text x="460" y="171" fill="#777772" font-size="10" font-weight="400">Departure</text><text x="460" y="192" fill="#242424" font-size="13" font-weight="400">18:40 UTC</text><text x="615" y="171" fill="#777772" font-size="10" font-weight="400">Arrival</text><text x="615" y="192" fill="#242424" font-size="13" font-weight="400">06:35 UTC +1</text><rect x="832" y="166" width="145" height="24" rx="12" fill="#fff6e5" stroke="#fff6e5"/><text x="842" y="182" fill="#9b6a1f" font-size="10" font-weight="500">Assessment required</text><text x="238" y="241" fill="#242424" font-size="15" font-weight="600">Mission assessment</text><text x="809" y="240" fill="#777772" font-size="10" font-weight="400">Updated with source context</text><rect x="236" y="258" width="244" height="92" rx="10" fill="white" stroke="#ececea"/><circle cx="253" cy="278" r="3" fill="#1c91ff"/><text x="265" y="282" fill="#777772" font-size="9" font-weight="600">WEATHER</text><text x="252" y="309" fill="#242424" font-size="15" font-weight="500">Arrival conditions</text><text x="252" y="332" fill="#777772" font-size="11" font-weight="400">Review forecast window</text><rect x="494" y="258" width="244" height="92" rx="10" fill="white" stroke="#ececea"/><circle cx="511" cy="278" r="3" fill="#1c91ff"/><text x="523" y="282" fill="#777772" font-size="9" font-weight="600">AIRCRAFT</text><text x="510" y="309" fill="#242424" font-size="15" font-weight="500">Limitation identified</text><text x="510" y="332" fill="#777772" font-size="11" font-weight="400">Assess mission impact</text><rect x="752" y="258" width="244" height="92" rx="10" fill="white" stroke="#ececea"/><circle cx="769" cy="278" r="3" fill="#1c91ff"/><text x="781" y="282" fill="#777772" font-size="9" font-weight="600">CREW</text><text x="768" y="309" fill="#242424" font-size="15" font-weight="500">Duty review</text><text x="768" y="332" fill="#777772" font-size="11" font-weight="400">Check recovery options</text><rect x="236" y="370" width="474" height="151" rx="10" fill="white" stroke="#ececea"/><text x="253" y="395" fill="#242424" font-size="13" font-weight="600">Aeros assessment</text><text x="253" y="422" fill="#565651" font-size="12" font-weight="400">A change at destination may affect the arrival plan.</text><text x="253" y="445" fill="#565651" font-size="12" font-weight="400">Compare timing and alternate options in mission context.</text><text x="253" y="468" fill="#565651" font-size="12" font-weight="400">Review crew, aircraft, and onward-leg dependencies.</text><rect x="253" y="484" width="93" height="24" rx="12" fill="#edf6ff" stroke="#edf6ff"/><text x="263" y="500" fill="#1876c9" font-size="10" font-weight="500">Weather</text><rect x="353" y="484" width="89" height="24" rx="12" fill="#e