<svg xmlns="http://www.w3.org/2000/svg" width="526" height="526" viewBox="0 0 526 526"><title>Aeros illustrative mission workspace</title><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#245575" flood-opacity=".08"/></filter></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="526" height="526" rx="0" fill="#e9f7ff" stroke="#e9f7ff"/><rect x="85" y="-24" width="480" height="380" rx="10" fill="white" stroke="#ececea"/><rect x="101" y="25" width="405" height="58" rx="10" fill="white" stroke="#ececea"/><circle cx="119" cy="47" r="3" fill="#1c91ff"/><text x="131" y="51" fill="#242424" font-size="13" font-weight="600">AR245 · Mission assessment</text><text x="119" y="70" fill="#777772" font-size="10" font-weight="400">JFK → LHR  /  Arrival review</text><text x="106" y="112" fill="#242424" font-size="17" font-weight="600">Relevant to this mission</text><rect x="106" y="131" width="31" height="24" rx="12" fill="#f3f3f2" stroke="#f3f3f2"/><text x="116" y="147" fill="#777772" font-size="10" font-weight="500">01</text><text x="149" y="147" fill="#242424" font-size="12" font-weight="600">Destination weather</text><text x="149" y="168" fill="#777772" font-size="10" font-weight="400">Forecast overlaps the planned arrival.</text><path d="M106 185h390" stroke="#ececea"/><rect x="106" y="197" width="31" height="24" rx="12" fill="#f3f3f2" stroke="#f3f3f2"/><text x="116" y="213" fill="#777772" font-size="10" font-weight="500">02</text><text x="149" y="213" fill="#242424" font-size="12" font-weight="600">Aircraft limitation</text><text x="149" y="234" fill="#777772" font-size="10" font-weight="400">Review against route and airport conditions.</text><path d="M106 251h390" stroke="#ececea"/><rect x="106" y="263" width="31" height="24" rx="12" fill="#f3f3f2" stroke="#f3f3f2"/><text x="116" y="279" fill="#777772" font-size="10" font-weight="500">03</text><text x="149" y="279" fill="#242424" font-size="12" font-weight="600">Crew and onward legs</text><text x="149" y="300" fill="#777772" font-size="10" font-weight="400">Assess recovery options in rotation context.</text><path d="M106 317h390" stroke="#ececea"/><g filter="url(#shadow)"><rect x="38" y="354" width="431" height="123" rx="10" fill="white" stroke="#ececea"/><circle cx="57" cy="376" r="3" fill="#e6a238"/><text x="69" y="380" fill="#242424" font-size="14" font-weight="600">A change worth reviewing</text><text x="57" y="405" fill="#777772" font-size="12" font-weight="400">Arrival conditions may affect the operating plan.</text><rect x="57" y="428" width="110" height="24" rx="12" fill="#edf6ff" stroke="#edf6ff"/><text x="67" y="444" fill="#1876c9" font-size="10" font-weight="500">View evidence</text><rect x="297" y="428" width="152" height="24" rx="12" fill="#1c91ff" stroke="#1c91ff"/><text x="307" y="444" fill="white" font-size="10" font-weight="500">Dispatcher review</text></g><text x="39" y="506" fill="#7292a4" font-size="9" font-weight="400">Illustrative mission assessment</text></g></svg>