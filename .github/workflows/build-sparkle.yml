name: Lint & Build (sparkle)

on:
  push:
    paths:
      - package-lock.json
      - sparkle/**
      - .github/workflows/build-sparkle.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Check translations
        run: npm -w sparkle run i18n:check
      # The steps below pass --ignore-scripts to skip their pre* i18n:compile hooks,
      # so the catalogs are compiled here.
      - name: Compile translations
        run: npm -w sparkle run i18n:compile
      - name: Build
        run: npm -w sparkle run build --ignore-scripts
      - name: Build Storybook
        run: npm -w sparkle run build-storybook --ignore-scripts
      - name: Unit tests
        run: npm -w sparkle run test:unit --ignore-scripts
