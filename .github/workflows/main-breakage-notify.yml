name: Main breakage notifier
run-name: ${{ github.event.workflow_run.name }} ${{ github.event.workflow_run.conclusion }} on main

on:
  workflow_run:
    workflows:
      - Lint & Build & Test (front)
      - Lint & Build & Test (front-api)
      - Lint & Build & Test (connectors)
      - Lint & Build & Test (core)
      - Lint & Build (marketing)
      - Lint & Build (sparkle)
      - Typecheck (spa)
      - Format/lint checks (oxc)
      - Check no new bulk lint suppressions
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    # Covers waiting for an automatic retry of the failed jobs.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notify Slack on a main state change
        uses: ./.github/actions/main-breakage
        with:
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: C09GELMTTRT
