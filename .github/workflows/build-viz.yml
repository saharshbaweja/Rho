name: Lint & Build & Test (viz)

on:
  push:
    paths:
      - package-lock.json
      - sparkle/**
      - viz/**
      - dockerfiles/viz.Dockerfile
      - .github/workflows/build-viz.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sparkle: "true"
      - name: Check translations
        run: npm -w viz run i18n:check
      - name: Build
        run: npm -w viz run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          build-sparkle: "true"
      - name: Test
        run: npm -w viz run test
