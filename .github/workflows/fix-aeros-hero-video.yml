name: Fix Aeros Hero Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct full hero video
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin video-fix-staging:refs/remotes/origin/video-fix-staging
          : > /tmp/video.b64
          for i in 00 01 02 03 04 05 06 07; do
            git show "origin/video-fix-staging:.video-fix/chunk${i}" >> /tmp/video.b64
          done
          base64 -d /tmp/video.b64 > /tmp/video.tar.gz
          mkdir -p /tmp/aeros-video
          tar -xzf /tmp/video.tar.gz -C /tmp/aeros-video
          cp /tmp/aeros-video/aeros-agentic-dispatch.mp4 marketing/public/static/landing/home/aeros-agentic-dispatch.mp4
          test "$(stat -c%s marketing/public/static/landing/home/aeros-agentic-dispatch.mp4)" -eq 46057
          duration="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 marketing/public/static/landing/home/aeros-agentic-dispatch.mp4)"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 39.4 <= d <= 39.6, d
          print(f"Verified duration: {d:.3f}s")
          PY

      - name: Commit only the repaired video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aeros site automation"
          git config user.email "actions@users.noreply.github.com"
          git add marketing/public/static/landing/home/aeros-agentic-dispatch.mp4
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "marketing/public/static/landing/home/aeros-agentic-dispatch.mp4"
          git commit -m "Fix full-length Aeros hero video"
          git push origin HEAD:main
